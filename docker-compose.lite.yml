version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: medi_ai_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: medi_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medi-ai-network
    restart: unless-stopped

  # Frontend (React)
  frontend:
    build:
      context: ./frontend/medi-ai
      dockerfile: Dockerfile
    container_name: medi_ai_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/medi-ai/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - medi-ai-network
    restart: unless-stopped
    environment:
      - REACT_APP_API_URL=http://localhost:8000
      - REACT_APP_WS_URL=ws://localhost:8000

volumes:
  postgres_data:
    driver: local

networks:
  medi-ai-network:
    driver: bridge
