services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: medi_ai_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: medi_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - medi-ai-network
    restart: unless-stopped

  # Backend API (Python) - Ollama runs separately on host
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medi_ai_backend
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/medi_ai
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=mistral
      - PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK=True
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    volumes:
      # Named volumes for persistent data
      - medi_ai_backend_data:/app/data
      - chroma_db_data:/app/database/chroma_db
      - backend_cache:/app/.cache
      # Bind mounts for development
      - ./backend:/app
      - ./backend/database:/app/database
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - medi-ai-network
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  # Frontend (React)
  frontend:
    build:
      context: ./frontend/medi-ai
      dockerfile: Dockerfile
    container_name: medi_ai_frontend
    ports:
      - "3000:3000"
    volumes:
      # Named volumes for build and node_modules (improves performance)
      - medi_ai_frontend_data:/app/build
      - frontend_node_modules:/app/node_modules
      # Bind mounts for development (hot reload)
      - ./frontend/medi-ai/src:/app/src
      - ./frontend/medi-ai/public:/app/public
      - ./frontend/medi-ai/package.json:/app/package.json
      - ./frontend/medi-ai/tailwind.config.js:/app/tailwind.config.js
      - ./frontend/medi-ai/postcss.config.js:/app/postcss.config.js
    depends_on:
      - backend
    networks:
      - medi-ai-network
    restart: unless-stopped
    environment:
      - REACT_APP_API_URL=http://backend:8000
      - REACT_APP_WS_URL=ws://backend:8000

volumes:
  postgres_data:
    driver: local
  medi_ai_backend_data:
    driver: local
  medi_ai_frontend_data:
    driver: local
  # Backend volumes
  chroma_db_data:
    driver: local
  backend_cache:
    driver: local
  # Frontend volumes
  frontend_node_modules:
    driver: local

networks:
  medi-ai-network:
    driver: bridge
